<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promotions — TicketBook Admin</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page">
  <div id="navbar"></div>
  <main class="container">
    <div class="flex-between section">
      <div>
        <h1>Promotions</h1>
        <p>Manage discount codes customers can apply at checkout.</p>
      </div>
    </div>

    <div class="panel section" style="max-width:480px;">
      <h3>Add promo code</h3>
      <form id="promo-form">
        <div class="field-row">
          <div>
            <label for="pr-code">Code</label>
            <input type="text" id="pr-code" required placeholder="SUMMER15" style="text-transform:uppercase;">
          </div>
          <div>
            <label for="pr-discount">Discount %</label>
            <input type="number" id="pr-discount" min="1" max="90" required placeholder="15">
          </div>
        </div>
        <div class="msg error" id="promo-form-msg"></div>
        <button type="submit" class="btn btn-primary btn-block">Add Promo Code</button>
      </form>
    </div>

    <div id="promos-table"></div>
  </main>
</div>

<script src="../js/data.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/admin.js"></script>
<script>
  requireRole('admin');
  renderNav('promos');
  initPromoManager();
</script>
</body>
</html>
