<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Events — TicketBook Admin</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page">
  <div id="navbar"></div>
  <main class="container">
    <div class="flex-between section">
      <div>
        <h1>Manage Events</h1>
        <p>Create, edit, and retire events available for booking.</p>
      </div>
      <button class="btn btn-primary" onclick="openEventModal()">+ Add Event</button>
    </div>
    <div id="events-table"></div>
  </main>
</div>

<!-- Add/Edit Event Modal -->
<div class="modal-overlay" id="event-modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="event-modal-title">Add Event</h3>
      <button class="modal-close" onclick="closeEventModal()">&times;</button>
    </div>
    <form id="event-form">
      <input type="hidden" id="ev-id">
      <label for="ev-title">Title</label>
      <input type="text" id="ev-title" required>
      <div class="field-row">
        <div>
          <label for="ev-category">Category</label>
          <select id="ev-category">
            <option>Movie</option><option>Concert</option><option>Sports</option><option>Comedy</option><option>Exhibition</option><option>Festival</option>
          </select>
        </div>
        <div>
          <label for="ev-emoji">Icon (emoji)</label>
          <input type="text" id="ev-emoji" maxlength="4" placeholder="🎬">
        </div>
      </div>
      <div class="field-row">
        <div>
          <label for="ev-date">Date</label>
          <input type="date" id="ev-date" required>
        </div>
        <div>
          <label for="ev-time">Time</label>
          <input type="time" id="ev-time" required>
        </div>
      </div>
      <label for="ev-venue">Venue</label>
      <input type="text" id="ev-venue" required>
      <div class="field-row">
        <div>
          <label for="ev-price">Price per seat (₹)</label>
          <input type="number" id="ev-price" min="1" required>
        </div>
        <div>
          <label for="ev-rows">Rows</label>
          <input type="number" id="ev-rows" min="1" max="12" required>
        </div>
        <div>
          <label for="ev-seatsperrow">Seats / row</label>
          <input type="number" id="ev-seatsperrow" min="1" max="14" required>
        </div>
      </div>
      <label for="ev-desc">Description</label>
      <textarea id="ev-desc" rows="3" required></textarea>
      <div class="msg error" id="event-form-msg"></div>
      <button type="submit" class="btn btn-primary btn-block">Save Event</button>
    </form>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/admin.js"></script>
<script>
  requireRole('admin');
  renderNav('events');
  initEventManager();
</script>
</body>
</html>
